<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تقرير فحص أمان الموقع</title>
<style>
body{background:#0d1117;color:#e6edf3;font-family:sans-serif;max-width:500px;margin:auto;padding:20px}
h1{color:#00ff88;font-size:22px}
input,button{width:100%;padding:12px;margin-top:10px;border-radius:8px;border:1px solid #00ff88;font-size:16px;box-sizing:border-box}
input{background:#161b22;color:#fff;direction:ltr}
button{background:#00ff88;color:#000;font-weight:bold}
.score{font-size:48px;text-align:center;margin:20px 0}
.row{padding:10px 0;border-bottom:1px solid #30363d}
.fix{color:#f0883e;font-size:13px;margin-top:4px}
.meta{color:#8b949e;font-size:14px;text-align:center}
small{color:#8b949e}
@media print{
  body{background:#fff;color:#000}
  h1{color:#000}
  input,button,small{display:none}
  .score{color:#000 !important}
  .row{border-bottom:1px solid #ccc}
  .fix{color:#444}
  .meta{color:#444}
}
</style>
</head>
<body>
<h1>🛡️ تقرير فحص أمان الموقع</h1>
<input id="url" placeholder="example.com">
<button id="scanbtn" onclick="scan()">افحص</button>
<div id="result"></div>
<small>افحص فقط المواقع التي تملك صلاحية عليها.</small>
<script>
async function scan(){
  const out=document.getElementById('result');
  out.textContent='جارٍ الفحص...';
  const u=document.getElementById('url').value;
  const r=await fetch('/scan?url='+encodeURIComponent(u));
  const d=await r.json();
  out.textContent='';
  if(d.error){out.textContent=d.error;return;}

  const meta=document.createElement('div');
  meta.className='meta';
  meta.textContent=d.url+' | '+new Date().toLocaleDateString('ar');
  out.appendChild(meta);

  const s=document.createElement('div');
  s.className='score';
  s.textContent=d.score+'/100';
  s.style.color=d.score>=70?'#00ff88':d.score>=40?'#f0883e':'#ff5555';
  out.appendChild(s);

  for(const c of d.checks){
    const row=document.createElement('div');
    row.className='row';
    row.textContent=(c.ok?'✅ ':'❌ ')+c.name;
    if(!c.ok){
      const f=document.createElement('div');
      f.className='fix';
      f.textContent='💡 '+c.fix;
      row.appendChild(f);
    }
    out.appendChild(row);
  }

  const b=document.createElement('button');
  b.textContent='📄 حفظ التقرير PDF';
  b.onclick=()=>window.print();
  out.appendChild(b);
}
</script>
</body>
</html>
